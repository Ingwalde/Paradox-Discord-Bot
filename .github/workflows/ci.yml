name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint, types and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check main.py paradox_bot/ tests/ scripts/
      - run: mypy
      # Known CVEs in what is pinned today. Dependabot is what moves the pins
      # forward; this is what fails the build when a pin goes bad in between.
      - run: pip-audit -r requirements.txt
      - name: Environment variables are documented
        run: python scripts/check_env_example.py
      - name: Version has a changelog entry
        run: python scripts/check_version_sync.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --cov=paradox_bot --cov-report=term-missing

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation on an amd64 runner, so buildx needs the
      # binfmt handlers registered first. Oracle's free tier only grants two
      # AMD micro instances, both already in use by the other bots here; a
      # third free machine has to be Ampere (arm64), hence the second platform.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      # Only publish from main. Pull requests build and scan the image so a
      # broken Dockerfile or a new CVE fails review, but nothing reaches the
      # registry until it is merged.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single-platform so the result can be loaded into the local daemon for
      # Trivy. A multi-platform build produces a manifest list, which `load`
      # cannot handle. The layers are cached, so the multi-arch push below
      # reuses this work for amd64 rather than repeating it.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          # Deploy pulls by sha- tag so the server runs the image built from the
          # commit CI validated, not whatever :latest points at by then.
          tags: |
            ghcr.io/ingwalde/paradox-wiki-bot:latest
            ghcr.io/ingwalde/paradox-wiki-bot:sha-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: only CVEs the project can actually act on fail the
      # build. The apt-get upgrade in deploy/Dockerfile is that action.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/ingwalde/paradox-wiki-bot:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Published as a manifest list covering both architectures, so the same
      # sha- tag runs on an AMD micro instance and on Ampere. Trivy scanned the
      # amd64 build above; the arm64 layers come from the same Dockerfile and
      # the same pinned base image, so a CVE in one is a CVE in the other.
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ingwalde/paradox-wiki-bot:latest
            ghcr.io/ingwalde/paradox-wiki-bot:sha-${{ github.sha }}
          cache-from: type=gha
