name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Two merges landing close together would otherwise start two deploys against
# the same host. cancel-in-progress stays false on purpose: a deploy
# interrupted midway through `up -d` leaves the stack in a worse state than one
# that waits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # Self-hosted because the host sits behind NAT: the runner polls GitHub, so
    # nothing has to reach in.
    runs-on: [self-hosted, paradox-bot]

    # This repository is public and this job runs on a personal machine, so the
    # gate is deliberately paranoid. workflow_run only ever fires from the
    # default branch's copy of this file, and a fork PR cannot push to main, so
    # requiring a *successful CI run triggered by a push to main* leaves no
    # path for someone else's code to execute here.
    #
    # DEPLOY_ENABLED also keeps the job from queueing forever (and then mailing
    # a failure) on a checkout where no runner is registered.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && vars.DEPLOY_ENABLED == 'true' }}

    permissions:
      contents: read

    env:
      # The runner wipes its own workspace between jobs, so the compose file is
      # copied to a directory that persists and holds .env, data/ and logs/.
      # Set the DEPLOY_DIR repository variable to the working copy on the host.
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the commit CI validated
        uses: actions/checkout@v7
        with:
          # Not whatever main points at by now: a second merge landing during
          # this deploy would otherwise ship its compose file against the
          # earlier commit's image.
          ref: ${{ github.event.workflow_run.head_sha }}

      # `powershell`, not `pwsh`: the runner host has Windows PowerShell 5.1
      # and no PowerShell 7, so `shell: pwsh` fails with "command not found".
      # Nothing below needs 7 -- no ternaries, no `&&` chaining.
      - name: Copy compose file into the deploy directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DEPLOY_DIR) {
            throw "DEPLOY_DIR repository variable is not set (see README > Деплой)."
          }
          if (-not (Test-Path $env:DEPLOY_DIR)) {
            throw "$env:DEPLOY_DIR does not exist. Create it and put .env there first (see README > Деплой)."
          }
          if (-not (Test-Path (Join-Path $env:DEPLOY_DIR '.env'))) {
            throw "No .env in $env:DEPLOY_DIR. The bot cannot start without TOKEN."
          }
          Copy-Item docker-compose.yml $env:DEPLOY_DIR -Force

      - name: Pull and restart
        shell: powershell
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "ghcr.io/ingwalde/paradox-wiki-bot:$env:IMAGE_TAG"
          Write-Host "Deploying $image"

          # A failed pull is NOT survivable: compose falls back to the locally
          # cached image, the old container starts, and the health check below
          # passes while nothing was actually deployed.
          docker compose pull
          if ($LASTEXITCODE -ne 0) {
            throw "Could not pull $image. Refusing to restart -- that would relaunch the previous image and report a successful deploy for code that never shipped."
          }

          docker compose up -d --remove-orphans
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed" }

      - name: Verify the running container is the image we pulled
        shell: powershell
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "ghcr.io/ingwalde/paradox-wiki-bot:$env:IMAGE_TAG"
          $want = docker image inspect $image --format '{{.Id}}'
          $container = docker compose ps -q paradox-bot
          $got = docker inspect --format '{{.Image}}' $container
          if ($want -ne $got) {
            throw "paradox-bot is running $got but the pulled image is $want -- a recreate must have failed."
          }
          Write-Host "Running image matches the pulled digest."

      - name: Wait for the health check to pass
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # start_period in the compose health check is 15s; allow well past it
          # so a slow gateway connect is not reported as a failed deploy.
          $deadline = (Get-Date).AddSeconds(90)
          $state = 'unknown'
          while ((Get-Date) -lt $deadline) {
            $state = docker inspect --format '{{.State.Health.Status}}' paradox-wiki-bot 2>$null
            if ($state -eq 'healthy') { Write-Host "Healthy."; exit 0 }
            if ($state -eq 'unhealthy') { break }
            Start-Sleep -Seconds 5
          }
          docker logs --tail 50 paradox-wiki-bot
          throw "Container did not become healthy within 90s (last state: $state)."
