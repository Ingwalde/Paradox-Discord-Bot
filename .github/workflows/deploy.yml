name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Two merges landing close together would otherwise start two deploys against
# the same host. cancel-in-progress stays false on purpose: a deploy
# interrupted midway through `up -d` leaves the stack in a worse state than one
# that waits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # Self-hosted because the host sits behind NAT: the runner polls GitHub, so
    # nothing has to reach in.
    runs-on: [self-hosted, paradox-bot]

    # This repository is public and this job runs on a personal machine, so the
    # gate is deliberately paranoid. workflow_run only ever fires from the
    # default branch's copy of this file, and a fork PR cannot push to main, so
    # requiring a *successful CI run triggered by a push to main* leaves no
    # path for someone else's code to execute here.
    #
    # DEPLOY_ENABLED also keeps the job from queueing forever (and then mailing
    # a failure) on a checkout where no runner is registered.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && vars.DEPLOY_ENABLED == 'true' }}

    permissions:
      contents: read

    env:
      # The runner wipes its own workspace between jobs, so the compose file is
      # copied to a directory that persists and holds .env, data/ and logs/.
      # Set the DEPLOY_DIR repository variable to the working copy on the host.
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the commit CI validated
        uses: actions/checkout@v7
        with:
          # Not whatever main points at by now: a second merge landing during
          # this deploy would otherwise ship its compose file against the
          # earlier commit's image.
          ref: ${{ github.event.workflow_run.head_sha }}

      # bash, not powershell: Windows PowerShell refuses to run the runner's
      # generated .ps1 unless the execution policy is loosened, and changing a
      # machine setting to make a deploy work is worse than writing portable
      # scripts. These same steps run unchanged on a Linux VPS later.
      - name: Copy compose file into the deploy directory
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_DIR:?DEPLOY_DIR repository variable is not set (see README > Деплой)}"
          [ -d "$DEPLOY_DIR" ] || { echo "::error::$DEPLOY_DIR does not exist. Create it and put .env there first."; exit 1; }
          [ -f "$DEPLOY_DIR/.env" ] || { echo "::error::No .env in $DEPLOY_DIR. The bot cannot start without TOKEN."; exit 1; }
          cp docker-compose.yml "$DEPLOY_DIR/"

      - name: Pull and restart
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          image="ghcr.io/ingwalde/paradox-wiki-bot:${IMAGE_TAG}"
          echo "Deploying ${image}"

          # A failed pull is NOT survivable: compose falls back to the locally
          # cached image, the old container starts, and the health check below
          # passes while nothing was actually deployed.
          if ! docker compose pull; then
            echo "::error::Could not pull ${image}. Refusing to restart -- that would relaunch the previous image and report a successful deploy for code that never shipped."
            exit 1
          fi

          docker compose up -d --remove-orphans

      - name: Verify the running container is the image we pulled
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          image="ghcr.io/ingwalde/paradox-wiki-bot:${IMAGE_TAG}"
          want=$(docker image inspect "$image" --format '{{.Id}}')
          got=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q paradox-bot)")
          if [ "$want" != "$got" ]; then
            echo "::error::paradox-bot is running $got but the pulled image is $want -- a recreate must have failed."
            exit 1
          fi
          echo "Running image matches the pulled digest."

      - name: Wait for the health check to pass
        shell: bash
        run: |
          set -uo pipefail
          # start_period in the compose health check is 15s; allow well past it
          # so a slow gateway connect is not reported as a failed deploy.
          for _ in $(seq 1 18); do
            state=$(docker inspect --format '{{.State.Health.Status}}' paradox-wiki-bot 2>/dev/null || echo unknown)
            if [ "$state" = "healthy" ]; then echo "Healthy."; exit 0; fi
            if [ "$state" = "unhealthy" ]; then break; fi
            sleep 5
          done
          docker logs --tail 50 paradox-wiki-bot || true
          echo "::error::Container did not become healthy within 90s (last state: ${state:-unknown})."
          exit 1
