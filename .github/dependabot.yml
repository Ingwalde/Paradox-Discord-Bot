version: 2

# Weekly dependency PRs. pip-audit would catch known CVEs in what is pinned
# today; this is what actually moves the pins forward.
#
# Everything targets the long-lived `deps` branch rather than main, matching the
# other repos here, so routine churn collects there and reaches main as one
# deliberate merge instead of a queue of open PRs against the default branch.
#
# Two costs, both worth knowing before touching this:
#
#   * `deps` drifts. Dependabot compares manifests against that branch, not
#     main, so a pin bumped by hand on main is invisible to it and the next PR
#     arrives on a stale base. Merge main into `deps` after any release that
#     touches a manifest.
#   * `target-branch` applies to version updates only. Dependabot *security*
#     updates always target the default branch — which is the behaviour you
#     want: an urgent patch should not wait in a queue.
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch/minor churn; majors still arrive individually
      # because those are the ones that need reading.
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types: [minor, patch]

  # Without this ecosystem Dependabot only sees requirements*.txt, and the
  # tool versions in .pre-commit-config.yaml drift away from the ones CI
  # installs. That already happened: pre-commit pinned mypy v1.14.1 while
  # requirements-dev.txt resolved to 1.20.2, so a hook could pass locally and
  # fail in CI. ruff and mypy are pinned exactly in requirements-dev.txt to
  # keep the pairing checkable.
  - package-ecosystem: pre-commit
    directory: /
    target-branch: deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
