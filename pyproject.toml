[project]
name = "paradox-discord-bot"
version = "0.0.2"
description = "Discord bot that searches Ukrainian Paradox game wikis"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "flask>=3.0,<4.0",
    "aiohttp>=3.9,<4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
